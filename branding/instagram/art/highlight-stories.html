<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<!--
  AI Founder Hub - Instagram HIGHLIGHT story frames. Render 1080x1920.
  Safe zones: top ~230px (profile UI) and bottom ~210px (reply bar) are kept clear.
  Usage: file://.../highlight-stories.html?h=start|workshops|bootcamp|dubai&n=1|2|3
-->
<style>
  :root {
    --void:#07070b; --panel:#0d0d14; --edge:#1e1e2a;
    --volt:#ccf244; --volt-deep:#9dc41c; --lilac:#b5a1ff;
    --paper:#f4f1e8; --ink:#14130e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"Inter", sans-serif; position:relative; }
  .display { font-family:"Bricolage Grotesque", sans-serif; }
  .serif { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; }
  .mono { font-family:"JetBrains Mono", monospace; }

  .tile { width:1080px; height:1920px; position:relative; overflow:hidden;
    padding:236px 84px 208px; display:flex; flex-direction:column; justify-content:space-between; }
  .bg-void  { background:var(--void);  color:#f4f4f5; }
  .bg-volt  { background:var(--volt);  color:var(--void); }
  .bg-paper { background:var(--paper); color:var(--ink); }

  .grain { position:absolute; inset:-50%; width:200%; height:200%; pointer-events:none; opacity:0.055; z-index:50;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .dots { position:absolute; inset:0; pointer-events:none; }
  .bg-void  .dots { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1.5px, transparent 0); background-size:46px 46px; }
  .bg-volt  .dots { background-image: radial-gradient(circle at 1px 1px, rgba(7,7,11,0.14) 1.5px, transparent 0); background-size:46px 46px; }
  .bg-paper .dots { background-image: radial-gradient(circle at 1px 1px, rgba(20,19,14,0.16) 1.5px, transparent 0); background-size:46px 46px; }

  .glow { position:absolute; width:680px; height:680px; border-radius:50%; filter:blur(160px); pointer-events:none; }

  .eyebrow { font-family:"JetBrains Mono", monospace; font-size:24px; font-weight:700; letter-spacing:0.34em; text-transform:uppercase; display:flex; align-items:center; gap:18px; }
  .eyebrow .dash { width:56px; height:2px; background:currentColor; opacity:0.5; }
  .bg-void .eyebrow { color:var(--volt); }
  .bg-volt .eyebrow { color:var(--void); opacity:0.85; }
  .bg-paper .eyebrow { color:#7c6df2; }

  h1 { font-family:"Bricolage Grotesque", sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:-0.02em; line-height:0.94; }
  .accent-volt { color:var(--volt); }
  .accent-lilac { color:var(--lilac); }
  .lead { font-size:36px; font-weight:600; line-height:1.5; }
  .bg-void .lead { color:#a1a1aa; }
  .bg-paper .lead { color:rgba(20,19,14,0.62); }

  .content { position:relative; z-index:10; }

  ul.checks { list-style:none; display:flex; flex-direction:column; gap:30px; }
  ul.checks li { display:flex; align-items:center; gap:26px; font-size:40px; font-weight:700; line-height:1.15; }
  .check { width:60px; height:60px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:900; flex-shrink:0; }

  .rows { display:flex; flex-direction:column; gap:22px; }
  .rowitem { display:flex; align-items:center; justify-content:space-between; border:2px solid var(--edge); border-radius:24px; padding:32px 38px; background:rgba(255,255,255,0.025); }
  .bg-paper .rowitem { border-color:rgba(20,19,14,0.14); background:rgba(20,19,14,0.03); }
  .rowitem .t { font-family:"Bricolage Grotesque", sans-serif; font-weight:800; font-size:42px; text-transform:uppercase; letter-spacing:-0.01em; }
  .chip { font-family:"JetBrains Mono", monospace; font-weight:700; font-size:24px; padding:12px 24px; border-radius:999px; }

  .ladder { display:flex; flex-direction:column; gap:0; }
  .step { display:flex; align-items:center; gap:30px; padding:30px 0; }
  .step + .step { border-top:2px solid rgba(20,19,14,0.12); }
  .bg-void .step + .step { border-top-color:var(--edge); }
  .step .n { font-family:"JetBrains Mono", monospace; font-size:30px; font-weight:700; flex-shrink:0; }
  .bg-paper .step .n { color:#9dc41c; }
  .bg-void .step .n { color:var(--volt); }
  .step .l { font-family:"Bricolage Grotesque", sans-serif; font-weight:800; font-size:48px; text-transform:uppercase; letter-spacing:-0.01em; }

  .bottom { position:relative; z-index:10; }
  .cta { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:42px; }
  .cta .pill { font-family:"JetBrains Mono", monospace; font-weight:700; font-size:30px; letter-spacing:0.06em; padding:24px 42px; border-radius:999px; }
  .brandrow { display:flex; align-items:center; gap:18px; }
  .brandrow .handle { font-family:"JetBrains Mono", monospace; font-size:26px; font-weight:700; letter-spacing:0.12em; opacity:0.6; }

  .bolt-watermark { position:absolute; right:-150px; bottom:-160px; opacity:0.06; z-index:1; }
</style>
</head>
<body>
<script>
const BOLT = (fill, size) => `<svg width="${size}" height="${size}" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${fill === 'volt' ? '#ccf244' : '#07070b'}"/><path d="M35 8 L18 38 H30 L27 56 L46 26 H33 Z" fill="${fill === 'volt' ? '#07070b' : '#ccf244'}"/></svg>`;
const BOLT_ONLY = (color, size) => `<svg width="${size}" height="${size}" viewBox="0 0 64 64"><path d="M35 8 L18 38 H30 L27 56 L46 26 H33 Z" fill="${color}"/></svg>`;

// CTA pill builders. Primary = filled, ghost = outlined. Colours flip by theme.
const pillPrimary = (theme, label) => theme === 'volt'
  ? `<span class="pill" style="background:var(--void); color:var(--volt);">${label}</span>`
  : `<span class="pill" style="background:var(--volt); color:var(--void);">${label}</span>`;
const pillGhost = (theme, label) => theme === 'volt'
  ? `<span class="pill" style="border:3px solid var(--void);">${label}</span>`
  : (theme === 'paper'
    ? `<span class="pill" style="border:3px solid rgba(20,19,14,0.3);">${label}</span>`
    : `<span class="pill" style="border:3px solid var(--edge); color:#d4d4d8;">${label}</span>`);

const bottom = (theme, ctaHtml) => `
  <div class="bottom">
    ${ctaHtml ? `<div class="cta">${ctaHtml}</div>` : ''}
    <div class="brandrow">${BOLT(theme === 'volt' ? 'void' : 'volt', 50)}<span class="handle">@aifounderhub.me</span></div>
  </div>`;

const STORIES = {
  start: [
    { theme: 'void', cta: null, html: `
      <div class="glow" style="background:rgba(204,242,68,0.13); top:-180px; left:-180px;"></div>
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>Start here</div>
        <h1 style="font-size:118px; margin-top:50px;">You bring<br/>the idea.</h1>
        <p class="serif accent-volt" style="font-size:96px; margin-top:30px;">AI writes the code.</p>
        <p class="lead" style="margin-top:54px; max-width:840px;">We teach the loop in between. This is the community where AI builders are made.</p>
      </div>` },
    { theme: 'paper', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>The path</div>
        <h1 style="font-size:82px; margin-top:46px;">Idea to <span class="serif" style="font-weight:400; text-transform:none; letter-spacing:0; color:#7c6df2;">income.</span></h1>
        <div class="ladder" style="margin-top:48px;">
          <div class="step"><span class="n">01</span><span class="l">Join free</span></div>
          <div class="step"><span class="n">02</span><span class="l">Learn the loop</span></div>
          <div class="step"><span class="n">03</span><span class="l">Build &amp; ship</span></div>
          <div class="step"><span class="n">04</span><span class="l">Get paid</span></div>
        </div>
      </div>` },
    { theme: 'volt', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>Your first step</div>
        <h1 style="font-size:108px; margin-top:50px;">Start free,<br/>this Friday.</h1>
        <p class="lead" style="margin-top:48px; color:rgba(7,7,11,0.7); max-width:820px;">A live masterclass, every week. Tap the link in our bio to save your seat.</p>
      </div>`, ctaSpec: (t) => pillPrimary(t, 'LINK IN BIO ↗') + pillGhost(t, 'COMMENT BUILD') },
  ],
  workshops: [
    { theme: 'void', cta: null, html: `
      <div class="glow" style="background:rgba(181,161,255,0.12); bottom:-180px; right:-180px;"></div>
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>Live masterclasses</div>
        <h1 style="font-size:124px; margin-top:50px;">Every<br/>Friday.</h1>
        <p class="serif accent-volt" style="font-size:104px; margin-top:30px;">Free.</p>
        <p class="lead" style="margin-top:50px; max-width:820px;">Ninety minutes. We build something real, live, with you. No code needed.</p>
      </div>` },
    { theme: 'paper', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>What's on</div>
        <h1 style="font-size:80px; margin-top:46px;">Pick your<br/>Friday.</h1>
        <div class="rows" style="margin-top:48px;">
          <div class="rowitem"><span class="t">Claude Blueprint</span></div>
          <div class="rowitem"><span class="t">OpenClaw Agents</span></div>
          <div class="rowitem"><span class="t">Build Apps Using AI</span></div>
          <div class="rowitem"><span class="t">AI Automations</span></div>
        </div>
      </div>` },
    { theme: 'volt', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>Join free</div>
        <h1 style="font-size:116px; margin-top:50px;">Save your<br/>seat.</h1>
        <p class="lead" style="margin-top:48px; color:rgba(7,7,11,0.7); max-width:820px;">Free, forever. Comment BUILD and we send the link, or grab it in our bio.</p>
      </div>`, ctaSpec: (t) => pillPrimary(t, 'COMMENT BUILD') + pillGhost(t, 'LINK IN BIO ↗') },
  ],
  bootcamp: [
    { theme: 'paper', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>The AI Builder Bootcamp</div>
        <h1 style="font-size:104px; margin-top:50px;">One goal.<br/><span class="serif" style="font-weight:400; text-transform:none; letter-spacing:0; color:#7c6df2;">One pathway.</span><br/>One month.</h1>
        <p class="lead" style="margin-top:50px; max-width:820px;">A focused cohort that takes you from where you are to a result you can show.</p>
      </div>` },
    { theme: 'void', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>4 pathways</div>
        <h1 style="font-size:78px; margin-top:46px;">Choose your<br/><span class="accent-volt">lane.</span></h1>
        <div style="margin-top:50px; display:flex; flex-direction:column; gap:24px;">
          ${['Founder Launch', 'Freelance Pro', 'Business Scale-Up', 'Automation Agency'].map((p, i) => `
            <div style="display:flex; align-items:center; gap:30px; border-bottom:2px solid var(--edge); padding-bottom:24px;">
              <span class="mono" style="font-size:30px; font-weight:700; color:var(--volt);">0${i + 1}</span>
              <span class="display" style="font-size:50px; font-weight:800; text-transform:uppercase; letter-spacing:-0.01em;">${p}</span>
            </div>`).join('')}
        </div>
      </div>` },
    { theme: 'volt', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>Ship a real result</div>
        <h1 style="font-size:128px; margin-top:50px;">$249.<br/>4 weeks.</h1>
        <p class="lead" style="margin-top:48px; color:rgba(7,7,11,0.7); max-width:820px;">Live labs, 1:1 checkpoints, templates, and a demo day finale. Seats are capped.</p>
      </div>`, ctaSpec: (t) => pillPrimary(t, 'DM TO APPLY') + pillGhost(t, 'LINK IN BIO ↗') },
  ],
  dubai: [
    { theme: 'void', cta: null, html: `
      <div class="glow" style="background:rgba(204,242,68,0.10); top:-160px; right:-160px;"></div>
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>Dubai</div>
        <h1 style="font-size:120px; margin-top:50px;">Build<br/>Night.</h1>
        <p class="serif accent-volt" style="font-size:88px; margin-top:30px;">Free. In person.</p>
        <p class="lead" style="margin-top:50px; max-width:820px;">Builders in one room, laptops open. Dubai rooted, open to everyone.</p>
      </div>` },
    { theme: 'paper', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>What happens</div>
        <h1 style="font-size:74px; margin-top:46px;">Bring a laptop.<br/>Leave with a <span class="serif" style="font-weight:400; text-transform:none; letter-spacing:0; color:#7c6df2;">prototype.</span></h1>
        <ul class="checks" style="margin-top:52px;">
          <li><span class="check" style="background:var(--ink); color:var(--volt);">✓</span>Build alongside other founders</li>
          <li><span class="check" style="background:var(--ink); color:var(--volt);">✓</span>Live help from Ahmed &amp; Zain</li>
          <li><span class="check" style="background:var(--ink); color:var(--volt);">✓</span>Meet the UAE builder community</li>
        </ul>
      </div>` },
    { theme: 'volt', cta: null, html: `
      <div class="content">
        <div class="eyebrow"><span class="dash"></span>Next one</div>
        <h1 style="font-size:124px; margin-top:50px;">RSVP<br/>free.</h1>
        <p class="lead" style="margin-top:48px; color:rgba(7,7,11,0.7); max-width:820px;">Dates drop here first. Tap the link in our bio to claim a spot at the next session.</p>
      </div>`, ctaSpec: (t) => pillPrimary(t, 'LINK IN BIO ↗') },
  ],
};

const params = new URLSearchParams(location.search);
const h = (params.get('h') || 'start').toLowerCase();
const set = STORIES[h] || STORIES.start;
const n = Math.min(set.length, Math.max(1, parseInt(params.get('n') || '1', 10)));
const frame = set[n - 1];
const cta = frame.ctaSpec ? frame.ctaSpec(frame.theme) : null;
const wmColor = frame.theme === 'volt' ? '#07070b' : (frame.theme === 'paper' ? '#14130e' : '#ccf244');

document.body.innerHTML = `
  <div class="tile bg-${frame.theme}">
    <div class="dots"></div>
    <div class="bolt-watermark">${BOLT_ONLY(wmColor, 600)}</div>
    ${frame.html}
    ${bottom(frame.theme, cta)}
    <div class="grain"></div>
  </div>`;
</script>
</body>
</html>
