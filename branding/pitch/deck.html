<style>
  :root{
    --void:#07070b; --void2:#0a0a12; --panel:#0d0d14; --edge:#20202c; --edge2:#2c2c3a;

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#000;}
  .display{font-family:"Bricolage Grotesque",sans-serif;}
  .serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;}
  .mono{font-family:"JetBrains Mono",monospace;}

  .slide{
    width:1280px;height:720px;position:relative;overflow:hidden;
    font-family:"Inter",sans-serif;background:var(--void);color:#f4f4f5;
  }
  .slide.volt{background:var(--volt);color:var(--void);}
  .inner{position:absolute;inset:0;z-index:6;padding:58px 64px;display:flex;flex-direction:column;}

  /* textures */
  .grid{position:absolute;inset:0;z-index:1;background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:64px 64px;}
  .volt .grid{background-image:
    linear-gradient(rgba(7,7,11,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(7,7,11,0.07) 1px, transparent 1px);}
  .scan{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0.4;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px);}
  .grain{position:absolute;inset:-40%;width:180%;height:180%;z-index:3;pointer-events:none;opacity:0.06;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
  .glow{position:absolute;border-radius:50%;filter:blur(130px);z-index:1;pointer-events:none;}
  .ghost{position:absolute;z-index:1;font-family:"Bricolage Grotesque";font-weight:800;line-height:0.8;letter-spacing:-0.04em;pointer-events:none;
    -webkit-text-stroke:2px rgba(204,242,68,0.10);color:transparent;}
  .cross{position:absolute;z-index:7;width:18px;height:18px;pointer-events:none;}
  .cross::before,.cross::after{content:"";position:absolute;background:rgba(204,242,68,0.5);}
  .cross::before{left:8px;top:0;width:2px;height:18px;}
  .cross::after{top:8px;left:0;height:2px;width:18px;}
  .volt .cross::before,.volt .cross::after{background:rgba(7,7,11,0.45);}

  /* chrome */
  .top{position:relative;z-index:8;display:flex;align-items:center;justify-content:space-between;}
  .tag{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700;letter-spacing:0.26em;text-transform:uppercase;color:var(--volt);display:flex;align-items:center;gap:12px;}
  .volt .tag{color:var(--void);}
  .tag .sq{width:9px;height:9px;background:var(--volt);box-shadow:0 0 12px var(--volt);}
  .volt .tag .sq{background:var(--void);box-shadow:none;}
  .meta{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;color:var(--zinc3);letter-spacing:0.1em;}
  .volt .meta{color:rgba(7,7,11,0.45);}

  .body{position:relative;z-index:8;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
  h1{font-family:"Bricolage Grotesque";font-weight:800;text-transform:uppercase;letter-spacing:-0.025em;line-height:0.9;}
  .av{color:var(--volt);} .al{color:var(--lilac);}
  .vglow{color:var(--volt);text-shadow:0 0 32px rgba(204,242,68,0.55);}
  .lead{font-size:20px;line-height:1.5;color:var(--zinc);font-weight:500;}

  .foot{position:relative;z-index:8;display:flex;align-items:center;gap:13px;padding-top:16px;border-top:1.5px solid var(--edge);}
  .volt .foot{border-color:rgba(7,7,11,0.2);}
  .foot .nm{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;}
  .foot .ft{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;letter-spacing:0.14em;color:var(--zinc3);text-transform:uppercase;}
  .volt .foot .ft{color:rgba(7,7,11,0.5);}

  .chip{border:1.5px solid var(--edge2);border-radius:999px;padding:9px 16px;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;color:var(--zinc);}
  .chip b{color:var(--volt);}

  @page{size:1280px 720px;margin:0;}
  @media print{.slide{page-break-after:always;}}
  body.single .slide{display:none;}
  body.single .slide.show{display:block;}
</style>
</head>
