<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root{
    --void:#07070b; --panel:#0d0d14; --panel2:#11111a; --edge:#1e1e2a;
    --volt:#ccf244; --volt-deep:#9dc41c; --lilac:#b5a1ff; --paper:#f4f1e8; --ink:#14130e;
    --zinc:#a1a1aa; --zinc2:#71717a; --zinc3:#52525b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#000;}
  .display{font-family:"Bricolage Grotesque",sans-serif;}
  .serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;}
  .mono{font-family:"JetBrains Mono",monospace;}

  .slide{
    width:1280px;height:720px;position:relative;overflow:hidden;
    font-family:"Inter",sans-serif;background:var(--void);color:#f4f4f5;
    padding:64px 72px;display:flex;flex-direction:column;
  }
  .slide.paper{background:var(--paper);color:var(--ink);}
  .slide.volt{background:var(--volt);color:var(--void);}

  /* textures */
  .dots{position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1.2px, transparent 0);background-size:40px 40px;}
  .paper .dots{background-image:radial-gradient(circle at 1px 1px, rgba(20,19,14,0.14) 1.2px, transparent 0);}
  .volt .dots{background-image:radial-gradient(circle at 1px 1px, rgba(7,7,11,0.13) 1.2px, transparent 0);}
  .glow{position:absolute;border-radius:50%;filter:blur(140px);pointer-events:none;}
  .wm{position:absolute;right:-90px;bottom:-110px;opacity:0.06;pointer-events:none;}

  /* chrome */
  .top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;letter-spacing:0.28em;text-transform:uppercase;color:var(--volt);display:flex;align-items:center;gap:14px;}
  .paper .kicker{color:#7c6df2;} .volt .kicker{color:var(--void);opacity:0.8;}
  .kicker .ln{width:42px;height:2px;background:currentColor;opacity:0.5;}
  .pageno{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700;color:var(--zinc3);display:flex;align-items:center;gap:12px;}
  .volt .pageno{color:rgba(7,7,11,0.5);} .paper .pageno{color:rgba(20,19,14,0.4);}

  .body{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;justify-content:center;}

  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.02em;line-height:0.95;}
  .av{color:var(--volt);} .al{color:var(--lilac);}
  .lead{font-size:21px;line-height:1.55;color:var(--zinc);max-width:760px;font-weight:500;}
  .paper .lead{color:rgba(20,19,14,0.7);}

  .foot{position:relative;z-index:5;display:flex;align-items:center;gap:14px;border-top:1px solid var(--edge);padding-top:18px;}
  .paper .foot{border-color:rgba(20,19,14,0.14);} .volt .foot{border-color:rgba(7,7,11,0.18);}
  .foot .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;}
  .foot .tag{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;letter-spacing:0.12em;color:var(--zinc3);text-transform:uppercase;}
  .volt .foot .tag{color:rgba(7,7,11,0.5);}

  /* reusable bits */
  .chips{display:flex;gap:12px;flex-wrap:wrap;}
  .chip{border:1.5px solid var(--edge);border-radius:999px;padding:10px 18px;font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700;color:var(--zinc);}
  .chip b{color:var(--volt);}

  .cardrow{display:flex;gap:18px;}
  .card{flex:1;border:1.5px solid var(--edge);border-radius:20px;padding:26px;background:rgba(255,255,255,0.025);}
  .card .ic{width:52px;height:52px;border-radius:14px;background:rgba(204,242,68,0.12);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;}
  .card h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:8px;}
  .card p{font-size:15px;line-height:1.5;color:var(--zinc);}

  ul.ticks{list-style:none;display:flex;flex-direction:column;gap:16px;}
  ul.ticks li{display:flex;align-items:flex-start;gap:16px;font-size:19px;font-weight:600;line-height:1.4;}
  .tick{width:30px;height:30px;border-radius:9px;background:var(--volt);color:var(--void);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex-shrink:0;margin-top:2px;}
  .dim{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--edge);color:var(--zinc2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0;margin-top:2px;}

  .src{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--zinc3);font-weight:500;}

  @page{size:1280px 720px;margin:0;}
  @media print{.slide{page-break-after:always;}}
  body.single .slide{display:none;}
  body.single .slide.show{display:flex;}
</style>
</head>
